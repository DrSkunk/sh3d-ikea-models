name: Build and Release Plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  SH3D_VERSION: "7.5"
  SH3D_JAR_URL: "https://downloads.sourceforge.net/project/sweethome3d/SweetHome3D/SweetHome3D-7.5/SweetHome3D-7.5.jar"

jobs:
  # Each platform builds its own JNI bridge and uploads it as an artifact.
  # The package job downloads and merges all of them before running ant.
  build-native:
    name: Build native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs-on: macos-14   # Apple Silicon
            shell: bash
            install: brew install draco
          - target: linux-x86_64
            runs-on: ubuntu-latest
            shell: bash
            install: |
              sudo apt-get update
              sudo apt-get install -y libdraco-dev
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            shell: bash
            install: |
              sudo apt-get update
              sudo apt-get install -y libdraco-dev
          - target: windows-x86_64
            runs-on: windows-latest
            # MSYS2 mingw64 gives us a GCC toolchain and pre-built libdraco.
            # The msys2 setup step below provisions both.
            shell: 'msys2 {0}'
            install: ":"  # provisioning happens via setup-msys2; no extra install
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up MSYS2 (Windows)
        if: matrix.target == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-draco

      # The compiled JNI binary is statically linked against libdraco, so a
      # cache hit gives us a self-contained binary even if the upstream draco
      # package gets bumped — only changes to the JNI sources or build script
      # invalidate it. On a hit we also skip the libdraco install entirely.
      - name: Cache native binary
        id: cache-native
        uses: actions/cache@v5
        with:
          path: src/com/drskunk/sh3dikea/draco/native/${{ matrix.target }}
          key: native-${{ matrix.target }}-${{ hashFiles('native/src/**', 'native/Makefile') }}

      - name: Install libdraco
        if: steps.cache-native.outputs.cache-hit != 'true' && matrix.target != 'windows-x86_64'
        shell: bash
        run: ${{ matrix.install }}

      - name: Build JNI library
        if: steps.cache-native.outputs.cache-hit != 'true' && matrix.target != 'windows-x86_64'
        shell: bash
        run: make -C native

      - name: Build JNI library (Windows)
        if: steps.cache-native.outputs.cache-hit != 'true' && matrix.target == 'windows-x86_64'
        shell: 'msys2 {0}'
        run: mingw32-make -C native

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: src/com/drskunk/sh3dikea/draco/native/${{ matrix.target }}
          if-no-files-found: error

  build:
    name: Build plugin artifact
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Cache Sweet Home 3D jar
        id: cache-sh3d-jar
        uses: actions/cache@v5
        with:
          path: lib/SweetHome3D.jar
          key: ${{ runner.os }}-sh3d-jar-${{ env.SH3D_VERSION }}

      - name: Download Sweet Home 3D jar
        if: steps.cache-sh3d-jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p lib
          curl -fL "${SH3D_JAR_URL}" -o lib/SweetHome3D.jar

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-downloads

      # download-artifact@v4 places each artifact in its own subdir named
      # after the artifact (e.g. `native-macos-arm64/libdracojni.dylib`).
      # Move them into the layout the ant build expects.
      - name: Stage native artifacts
        shell: bash
        run: |
          set -euo pipefail
          dest="src/com/drskunk/sh3dikea/draco/native"
          mkdir -p "$dest"
          for d in native-downloads/native-*; do
            target="$dest/${d##*/native-}"
            mkdir -p "$target"
            cp -R "$d"/. "$target/"
          done
          find "$dest" -type f

      - name: Build plugin
        run: ant -Dsh3d.jar=lib/SweetHome3D.jar package

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: IkeaBrowser-sh3p
          path: dist/IkeaBrowser.sh3p
          if-no-files-found: error

  release:
    name: Publish GitHub release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: IkeaBrowser-sh3p

      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: IkeaBrowser.sh3p
